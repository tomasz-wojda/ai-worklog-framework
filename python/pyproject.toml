[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-worklog-framework"
version = "0.4.0"
description = "Executable operator layer for DevOps daily workflow automation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
ai-worklog-python = "ai_worklog_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]
